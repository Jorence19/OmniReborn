server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.com;
    root /var/www/omnireborn;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:db|sqlite3?|csv|json|py|sql|env|md|log|ya?ml|ini|sh|service|timer)$ { deny all; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
}
