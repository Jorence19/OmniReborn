limit_req_zone $binary_remote_addr zone=omnireborn_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=omnireborn_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /api/ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        limit_req zone=omnireborn_api burst=20 nodelay;
        limit_conn omnireborn_conn 10;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Server;
    }

    location / { return 404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
